
Keep alive · YML
name: Supabase Keep Alive
 
# 메종드펜싱 Supabase 무료 프로젝트가 7일 비활성으로 멈추지 않도록
# 매일 한 번씩 DB에 가벼운 요청을 보내 inactivity 타이머를 리셋합니다.
 
on:
  schedule:
    # 매일 UTC 00:00 (한국시간 오전 9시)에 실행
    - cron: "0 0 * * *"
  workflow_dispatch: # 필요할 때 수동 실행 버튼도 제공
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase at $(date)"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/${{ secrets.SUPABASE_TABLE }}?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $HTTP_STATUS"
          # 2xx면 성공, RLS로 빈 결과가 와도 DB에 요청이 닿았으므로 타이머는 리셋됨
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Supabase ping failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Supabase pinged successfully."
 
